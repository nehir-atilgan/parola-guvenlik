<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Farkındalık Rehberi · Parola Güvenliği</title>
  <link rel="stylesheet" href="css/stil.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%F0%9F%94%90%3C/text%3E%3C/svg%3E">
</head>
<body>
  <header class="ust">
    <a href="index.html" class="logo">🔐 Parola Güvenliği</a>
    <nav id="menu" class="menu"></nav>
  </header>

  <main class="icerik">
    <p id="yukleniyor">Yükleniyor…</p>
    <p id="hata" class="mesaj hata" role="alert" hidden></p>

    <!-- Konu listesi -->
    <section id="liste-bolum" hidden>
      <h1>Farkındalık Rehberi</h1>
      <p class="soluk">Parola güvenliğinin temel konuları, kısa ve uygulanabilir şekilde. Okuduktan sonra
        <a href="quiz.html">10 soruluk quiz</a> ile kendinizi test edin.</p>
      <ol id="konular" class="konu-listesi"></ol>
    </section>

    <!-- Tek konu -->
    <article id="konu-bolum" class="konu" hidden>
      <p class="kucuk"><a href="rehber.html">← Tüm konular</a></p>
      <p class="soluk kucuk" id="konu-sira"></p>
      <h1 id="konu-baslik"></h1>
      <p id="konu-ozet" class="konu-ozet"></p>
      <div id="konu-icerik" class="konu-icerik"></div>
      <aside class="kisaca">
        <h2>Kısaca</h2>
        <ul id="konu-maddeler"></ul>
      </aside>
      <div class="konu-cta">
        <a class="btn" href="quiz.html">Bilgini test et</a>
        <a class="metin-btn" href="analiz.html">Parolanı analiz et</a>
      </div>
      <nav class="konu-gezinme">
        <a id="onceki" hidden></a>
        <a id="sonraki" hidden></a>
      </nav>
    </article>
  </main>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/oturum.js"></script>
  <script>
    const $ = (id) => document.getElementById(id);
    const eleman = (etiket, metin, sinif) => {
      const e = document.createElement(etiket);
      if (metin !== undefined) e.textContent = metin;
      if (sinif) e.className = sinif;
      return e;
    };

    async function listeyiGoster() {
      const konular = await api.rehber();
      const ol = $("konular");
      konular.forEach((k) => {
        const li = document.createElement("li");
        const a = eleman("a", undefined, "konu-karti");
        a.href = "rehber.html?konu=" + encodeURIComponent(k.slug);
        a.append(eleman("span", String(k.sira), "konu-no"), eleman("strong", k.baslik), eleman("span", k.ozet, "soluk"));
        li.appendChild(a);
        ol.appendChild(li);
      });
      document.title = "Farkındalık Rehberi · Parola Güvenliği";
      $("liste-bolum").hidden = false;
    }

    async function konuyuGoster(slug) {
      const k = await api.rehberKonusu(slug);
      document.title = k.baslik + " · Parola Güvenliği";
      $("konu-sira").textContent = `Konu ${k.sira} / 7`;
      $("konu-baslik").textContent = k.baslik;
      $("konu-ozet").textContent = k.ozet;
      k.paragraflar.forEach((p) => $("konu-icerik").appendChild(eleman("p", p)));
      k.anahtar_noktalar.forEach((m) => $("konu-maddeler").appendChild(eleman("li", m)));

      for (const [id, komsu, ok] of [["onceki", k.onceki, "← "], ["sonraki", k.sonraki, ""]]) {
        if (!komsu) continue;
        const a = $(id);
        a.href = "rehber.html?konu=" + encodeURIComponent(komsu.slug);
        a.textContent = id === "onceki" ? ok + komsu.baslik : komsu.baslik + " →";
        a.hidden = false;
      }
      $("konu-bolum").hidden = false;
    }

    (async () => {
      const slug = new URLSearchParams(location.search).get("konu");
      try {
        await (slug ? konuyuGoster(slug) : listeyiGoster());
      } catch (hata) {
        $("hata").textContent = hata.durum === 404 ? "Bu konu bulunamadı." : hata.message;
        $("hata").hidden = false;
      } finally {
        $("yukleniyor").hidden = true;
      }
    })();
  </script>
</body>
</html>
